<section>
<h2>اليوم 1: هل يغلب النموذج القاعدة البسيطة، وكم يكلف خطؤه؟</h2>
<ol>
<li><p>في معمل الغاز نموذج يحسب جرعة مانع التآكل، ويكتب جدول الحقن لليوم التالي في نظام التحكم كل ليلة ضمن حدود ثابتة. الفني يراجع السجل أسبوعيًّا ويستطيع إيقاف الجدول. ما المستوى، وما الأدلة الإضافية؟</p><ul><li><b>أ.</b> استشاري، لأن الفني يستطيع الإيقاف؛ يكفي اختبار على خط أساس</li><li><b>ب.</b> إشرافي؛ تضاف حدود خارج النموذج، وتجاوز مجرَّب، ووضع بديل</li><li><b>ج.</b> حلقة مغلقة؛ يلزم ملف إثبات سلامة معتمد قبل أي شيء</li><li><b>د.</b> استشاري، لأن الحساب بسيط والجرعة صغيرة ولا تمس السلامة</li></ul></li>
<li><p>مورّد آخر يعرض على مكتب الشبكة تنبؤًا لليوم التالي: «خطؤنا 3% على العام الماضي، وأفضل من التنبؤ الساذج بأربعين في المئة». ما أول ما تطلبه قبل أي تجربة؟</p><ul><li><b>أ.</b> الخطأ المطلق بالميغاواط بدل النسبة المئوية، لكل ساعة من العام</li><li><b>ب.</b> اسم الخوارزمية وعدد متغيراتها</li><li><b>ج.</b> تجربة صامتة ثلاثة أشهر في المكتب قبل أي سؤال عن الرقم</li><li><b>د.</b> هل دخل العام الماضي التدريب، وبأي ساذج وبأي مهلة قارن</li></ul></li>
<li><p>تنبؤ جديد خطؤه السنوي أقل من الاستمرارية بقليل، لكنه في ساعات الذروة يتنبأ بأقل من الحمل بضعف ما تفعله الاستمرارية. والميغاواط الناقصة تكلف أربعة أضعاف الزائدة. بماذا توصي؟</p><ul><li><b>أ.</b> أسعّر أخطاءه بالتكلفتين، وأحكم بالتكلفة لا بالمتوسط</li><li><b>ب.</b> أعتمده، لأن خطأه السنوي أقل من خطأ الاستمرارية</li><li><b>ج.</b> أرفضه، لأن أي انحياز في ساعات الذروة مرفوض مهما صغر</li><li><b>د.</b> أعتمده وأضيف هامشًا ثابتًا إلى تنبؤه في كل الساعات</li></ul></li>
<li><p>يسلّمك المورّد نموذج العمر المتبقي مع «عتبة موصى بها» قدرها 20 دورة، ويقول إنها تعطي أعلى دقة على بياناته. ماذا تفعل قبل التشغيل؟</p><ul><li><b>أ.</b> أعتمد 20، فالمورّد أعرف بنموذجه</li><li><b>ب.</b> أختار العتبة التي تلتقط أكثر الأعطال قبل وقوعها في بيانات الاختبار</li><li><b>ج.</b> أسعّر كل عتبة بتكاليفنا، المتأخر والمتروك، وأختار الأرخص</li><li><b>د.</b> أختار أكبر عتبة ممكنة حتى لا يتأخر أي تنبيه</li></ul></li>
<li><p>في محطة الكهرباء نموذج يتنبأ بارتفاع حرارة محامل التوربين، ويعرض تنبيهًا على شاشة غرفة التحكم. المشغّل يقرر هل يخفض الحمل. ما مستوى التحكم؟</p><ul><li><b>أ.</b> استشاري: المشغّل يقرر ويخفض الحمل بيده</li><li><b>ب.</b> إشرافي: لأن التنبيه يصل إلى غرفة التحكم مباشرة</li><li><b>ج.</b> حلقة مغلقة: لأن الخطأ قد يوقف التوربين</li><li><b>د.</b> لا يُصنَّف: النموذج تنبؤ لا تحكم</li></ul></li>
<li><p>نموذج تحسين يكتب كل ساعة نقطة ضبط حرارة الفرن ضمن حدود ثابتة، والمشرف يراقب ويستطيع إيقافه. المورّد قدّم اختبارًا رجعيًّا على بيانات لم يرها النموذج وتجربة صامتة. ما الذي ينقص قبل التشغيل؟</p><ul><li><b>أ.</b> لا شيء: الاختبار والتجربة الصامتة يكفيان كل مستوى</li><li><b>ب.</b> ملف إثبات سلامة معتمد وطبقة حماية مستقلة</li><li><b>ج.</b> حدود تُفرض خارج النموذج، وتجاوز مجرَّب، ووضع بديل</li><li><b>د.</b> تجربة صامتة أطول، ستة أشهر بدل ثلاثة</li></ul></li>
<li><p>يقول مورّد: «نموذجنا استشاري، فهو نفسه الذي اعتمدتموه العام الماضي لعرض التقدير على الشاشة». الجديد أن تقديره سيدخل المتحكم المتقدم مباشرة. ما ردك؟</p><ul><li><b>أ.</b> يبقى استشاريًّا ما دام النموذج لم يتغير</li><li><b>ب.</b> حلقة مغلقة بأدلتها، ولو لم يتغير النموذج</li><li><b>ج.</b> يكفي أن يتدرب المشغّلون على التوصيل الجديد</li><li><b>د.</b> يصير إشرافيًّا لأن المشغّل يرى المتحكم</li></ul></li>
<li><p>تبني الاستمرارية لتنبؤ يصدر قبل الساعة المستهدفة بـ24 ساعة. زميلك استعمل حمل الساعة السابقة. ما أثر ذلك على المقارنة؟</p><ul><li><b>أ.</b> لا أثر: الاستمرارية قاعدة واحدة مهما كانت مهلتها</li><li><b>ب.</b> يظلم الاستمرارية، لأن الساعة السابقة أبعد عن الهدف</li><li><b>ج.</b> يظلم النموذج: خط الأساس يعرف ما لا يعرفه</li><li><b>د.</b> يجعل المقارنة أدق، لأن الساعة السابقة أحدث بيانات</li></ul></li>
<li><p>نموذج تنبؤ دُرّب على 2022 و2023، وخطؤه على 2023 هو 3.2%. ماذا يقول هذا الرقم عن أدائه في 2025؟</p><ul><li><b>أ.</b> القليل: هذا رقم الحفظ لا التنبؤ</li><li><b>ب.</b> أن خطأه في 2025 سيكون نحو 3.2%</li><li><b>ج.</b> أن خطأه في 2025 سيكون أقل، لأن البيانات تزيد</li><li><b>د.</b> أنه أفضل من الاستمرارية في 2025</li></ul></li>
<li><p>تنبؤ متوسط خطئه السنوي 3.0%، والاستمرارية 3.1%. في ساعات الذروة انحيازه سالب وكبير، وانحياز الاستمرارية قريب من الصفر. أي استنتاج تسنده هذه الأرقام؟</p><ul><li><b>أ.</b> التنبؤ أفضل، لأن متوسط خطئه أقل</li><li><b>ب.</b> التنبؤ أسوأ في كل الساعات</li><li><b>ج.</b> الانحياز لا يهم ما دام الخطأ المطلق متقاربًا</li><li><b>د.</b> التنبؤ يحتاج تسعيرًا بالذروة قبل أي حكم</li></ul></li>
<li><p>في ملف من السجل التاريخي تتكرر قراءة الحمل نفسها خمس ساعات متتالية، ثم تعود إلى التغير. ماذا تفعل قبل حساب خطأ النموذج على هذا الأسبوع؟</p><ul><li><b>أ.</b> أحسب كما هو: الحمل قد يثبت ساعات في الليل والعطل</li><li><b>ب.</b> أعلّمها قيمة مجمّدة وأستبعدها، وأسجل العيب</li><li><b>ج.</b> أحذف الأسبوع كله من الاختبار</li><li><b>د.</b> أستبدلها بتنبؤ النموذج نفسه</li></ul></li>
<li><p>فريق العمرات يحتاج 15 دورة لتجهيز القطع. جاء أول تنبيه لتوربين قبل عطله بـ9 دورات. كيف يُصنَّف هذا التنبيه في التسعير؟</p><ul><li><b>أ.</b> في وقته، لأنه جاء قبل العطل</li><li><b>ب.</b> إنذار كاذب، لأنه لم يمنع العطل</li><li><b>ج.</b> متأخر، فيُسعَّر توقفًا غير مخطط</li><li><b>د.</b> عمر متروك، لأن التوربين عمل بعد التنبيه</li></ul></li>
<li><p>حسبت أن العتبة الأقل تكلفة 60 دورة. ثم انخفضت تكلفة التوقف غير المخطط إلى النصف بعقد صيانة جديد. ماذا تفعل بالعتبة؟</p><ul><li><b>أ.</b> أعيد تسعير العتبات بالتكلفة الجديدة</li><li><b>ب.</b> أبقيها، لأن العتبة صفة في النموذج</li><li><b>ج.</b> أرفعها، لأن التوقف غير المخطط صار أرخص من قبل</li><li><b>د.</b> أسأل المورّد عن عتبته الموصى بها</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من الإنذار إلى حجة السلامة وخريطة الفرص</h2>
<ol>
<li><p>بعد شهر يعود «أفلاك» بنسخة جديدة: «خطؤها في ساعات الذروة على 2024 أقل من الاستمرارية». ما الذي ينقص هذا الادعاء لتقبله؟</p><ul><li><b>أ.</b> أن تكون 2024 خارج تدريبها، وأن يُسعَّر الخطأ بالتكلفتين</li><li><b>ب.</b> لا ينقصه شيء: الذروة هي ما طلبناه</li><li><b>ج.</b> أن يكون متوسط خطئه السنوي أقل أيضًا</li><li><b>د.</b> أن يشرح الخوارزمية الجديدة وأسباب تحسنها في ساعات الذروة</li></ul></li>
<li><p>إعداد يكشف كل الأعطال التي يكشفها غيره بأقل تأخر، لكنه يرفع إنذارًا كاذبًا في نحو عُشر وقت التشغيل الطبيعي. والإعداد الآخر يكشف الأعطال نفسها بتأخر أطول وإنذارات أقل كثيرًا. كيف تختار؟</p><ul><li><b>أ.</b> الأسرع دائمًا، لأن التأخر في العطل أخطر</li><li><b>ب.</b> الأقل إنذارًا كاذبًا، حتى لا يتعب المشغّل</li><li><b>ج.</b> أسعّر الأخطاء الثلاثة، وأسأل صاحبة الإنذارات عن حد الغرفة</li><li><b>د.</b> الإعداد الذي ضبطه المورّد على بيانات المعايرة، لأنه أعرف بكاشفه</li></ul></li>
<li><p>في حجة لنظام استشاري يوصي بنسبة الهواء إلى الوقود في غلايات البخار: «G4: النموذج يعمم على كل أحمال الغلاية. الدليل: تجربة صامتة ستة أسابيع في حمل متوسط، وافق فيها المشغّلون على 85% من التوصيات». ما الخلل الأهم؟</p><ul><li><b>أ.</b> ستة أسابيع مدة قصيرة لتجربة صامتة في غلاية</li><li><b>ب.</b> الادعاء أوسع من دليله، والموافقة لا تثبت صحة التوصية</li><li><b>ج.</b> 85% نسبة منخفضة لنظام سيُعتمد عليه في غرفة التحكم كل يوم</li><li><b>د.</b> الدليل غير مذكور برقمه من سجل الأدلة المعتمد</li></ul></li>
<li><p>تسلمت حجة سلامة صاغها مساعد: كل مصادر الخطر الستة لها سطر، وكل سطر يذكر دليلًا برقمه، والصياغة ممتازة. ما أول ما تفعله قبل رفعها إلى مدير سلامة العمليات؟</p><ul><li><b>أ.</b> أطلب من المساعد أن يراجعها ويصحح ما يجده</li><li><b>ب.</b> أرفعها كما هي، فالتغطية الكاملة لمصادر الخطر دليل على جودتها</li><li><b>ج.</b> أختصرها إلى صفحة واحدة ليقرأها المدير</li><li><b>د.</b> أطابق أرقام الأدلة بالسجل، وأقيّمها بقائمة التحقق</li></ul></li>
<li><p>في خريطة ثلاث حالات. الأولى قيمتها الصافية 30 مليونًا، وجاهزيتها 3، ومخاطرها 3. الثانية 12 مليونًا، وجاهزيتها 5، ومخاطرها 1. الثالثة 20 مليونًا، وجاهزيتها 4، ومخاطرها 2. أيها المشروع التجريبي؟</p><ul><li><b>أ.</b> الثالثة: أعلى قيمة صافية بين الحالتين المرشحتين</li><li><b>ب.</b> الأولى: أعلى قيمة صافية في الخريطة كلها، وهي ما يهم الإدارة</li><li><b>ج.</b> الثانية: أعلى جاهزية وأقل مخاطر، فخطؤها أرخص ما يكون</li><li><b>د.</b> لا شيء حتى ترتفع جاهزية الأولى</li></ul></li>
<li><p>كاشف أعطال رفع إنذارًا في الدقيقة الأولى بعد بدء عطل، ثم بقي الإنذار مرفوعًا في 12% فقط من العينات بعده. وفي التشغيل الطبيعي ينذر في 10% من العينات. كيف تسجّل هذا العطل؟</p><ul><li><b>أ.</b> مكشوف بلا تأخر، لأن أول إنذار جاء فورًا</li><li><b>ب.</b> إنذار كاذب، لأن الحصة منخفضة</li><li><b>ج.</b> مكشوف بتأخر طويل، لأن الإنذار تقطّع</li><li><b>د.</b> فائت: حصته كحصة التشغيل الطبيعي</li></ul></li>
<li><p>إعدادان لكاشف بالتكلفة نفسها تقريبًا: الأول يكشف أسرع ويرفع 200 إنذار كاذب في الشهر، والثاني أبطأ ويرفع 40. غرفة التحكم فيها مشغّلان. أيهما تقترح، ولماذا؟</p><ul><li><b>أ.</b> الأول، لأن الكشف الأسرع أهم دائمًا</li><li><b>ب.</b> الثاني، لأن كثرة الكاذب تعلّم التجاهل</li><li><b>ج.</b> أيهما، فالتكلفة واحدة</li><li><b>د.</b> لا هذا ولا ذاك، حتى يصل المورّد إلى صفر إنذار كاذب</li></ul></li>
<li><p>دليل الاختبار الوحيد لنظام استشاري من أشهر الصيف، والضواغط الأربعة عاملة. كيف تكتب نطاق التشغيل في الحجة؟</p><ul><li><b>أ.</b> على مدار السنة، مع مراقبة أداء النظام في الشتاء</li><li><b>ب.</b> الصيف والضواغط الأربعة، والباقي ثغرة</li><li><b>ج.</b> كل الأحوال، لأن النظام استشاري والمشغّل يقرر</li><li><b>د.</b> كما يحدده المورّد في عرضه</li></ul></li>
<li><p>في حجة: «G2: عاقبة التوصية الخاطئة محدودة. الدليل: سجل الاختبار الدوري لمتحكم منع الاندفاع ونظام السلامة الآلي». ماذا يثبت هذا الدليل؟</p><ul><li><b>أ.</b> أن التوصيات صحيحة، لأن طبقات الحماية تعمل</li><li><b>ب.</b> لا شيء، لأنه لا يتعلق بالنموذج</li><li><b>ج.</b> أن طبقتي الحماية تعملان فتحدّان العاقبة، لا أكثر</li><li><b>د.</b> أن المشغّل يتجاهل التوصية الخاطئة</li></ul></li>
<li><p>مورّد نظام استشاري يطلب دخولًا عن بعد دائمًا إلى خادمه في المنطقة الوسيطة بحساب مشترك «لسرعة الدعم». أي بند تكتبه في الحجة والعقد؟</p><ul><li><b>أ.</b> دخول دائم بحساب مشترك، مع كلمة مرور قوية</li><li><b>ب.</b> منع أي دخول عن بعد مهما كانت الحاجة</li><li><b>ج.</b> دخول عبر سحابة المورّد بدل الدخول إلى المنطقة الوسيطة</li><li><b>د.</b> حساب لكل شخص، وفتح بموافقة لمدة محددة، وتسجيل</li></ul></li>
<li><p>مورّد يقدّر قيمة نظامه بـ6 ملايين ريال قياسًا على «عدم فعل شيء». القاعدة المستعملة اليوم في الجهة تحقق 5 ملايين من هذه القيمة. ما القيمة التي تدخل الخريطة؟</p><ul><li><b>أ.</b> مليون: ما يضيفه على القاعدة الحالية</li><li><b>ب.</b> 6 ملايين، لأنها الرقم المكتوب في عرض المورّد</li><li><b>ج.</b> 11 مليونًا: القيمتان معًا</li><li><b>د.</b> 5 ملايين، لأن القاعدة تحققها</li></ul></li>
<li><p>حالة قيمتها 5.4 مليون ريال، ويستهلك نموذجها 3,000 ميغاواط ساعة في السنة بسعر 180 ريالًا. بسلّم الورشة (من 1 إلى أقل من 5 درجة 2، ومن 5 إلى أقل من 15 درجة 3)، ما درجة القيمة؟</p><ul><li><b>أ.</b> 3، لأن القيمة المكتوبة في الحالة 5.4 مليون</li><li><b>ب.</b> 2، لأن القيمة الصافية 4.86 مليون</li><li><b>ج.</b> 3، لأن الطاقة تُكتب ولا تُطرح</li><li><b>د.</b> 1، لأن الطاقة تلغي القيمة</li></ul></li>
<li><p>في خريطتك حالة بحلقة مغلقة، قيمتها عالية، وخانة صاحب صلاحية التجاوز فيها «يُحدَّد لاحقًا». ما أثر ذلك؟</p><ul><li><b>أ.</b> لا أثر، ما دامت الحالة ليست المشروع التجريبي</li><li><b>ب.</b> تنقص درجة معيار السلامة قليلًا</li><li><b>ج.</b> تمنع النجاح حتى تُسمّى الوظيفة</li><li><b>د.</b> تُخفض درجة القيمة إلى 1</li></ul></li>
</ol>

ور ويترك المشكلة: الحساب المشترك لا يُعرف صاحبه، والدائم لا يُراقَب","يرفض الدخول كليًّا، والمرجع الوطني يجيزه استثناءً بضوابط","ينقل نقطة الدخول ولا يضبطها",""],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"remote-access-otcc","title":"دخول المورّد اليوم مفتوح دائمًا بحساب مشترك، والمرجع الوطني يطلب العكس"},"level":"apply","pool":"practice"},{"id":"q-map-01","type":"single","prompt":"مورّد يقدّر قيمة نظامه بـ6 ملايين ريال قياسًا على «عدم فعل شيء». القاعدة المستعملة اليوم في الجهة تحقق 5 ملايين من هذه القيمة. ما القيمة التي تدخل الخريطة؟","options":[{"key":"أ","text":"مليون: ما يضيفه على القاعدة الحالية"},{"key":"ب","text":"6 ملايين، لأنها الرقم المكتوب في عرض المورّد"},{"key":"ج","text":"11 مليونًا: القيمتان معًا"},{"key":"د","text":"5 ملايين، لأن القاعدة تحققها"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"القيمة في الخريطة على خط الأساس المقيس: ما يضيفه النظام على القاعدة المستعملة اليوم، لا على عدم فعل شيء.","misconceptions":["","يقبل القيمة المحسوبة على أضعف قاعدة","يجمع قيمة القاعدة إلى قيمة النظام، والنظام يحل محلها","يكتب قيمة القاعدة لا ما يضيفه النظام عليها"],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"value-on-baseline","title":"القيمة تُحسب على القاعدة المستعملة اليوم، لا على أضعف قاعدة"},"level":"apply","pool":"practice"},{"id":"q-map-02","type":"single","prompt":"حالة قيمتها 5.4 مليون ريال، ويستهلك نموذجها 3,000 ميغاواط ساعة في السنة بسعر 180 ريالًا. بسلّم الورشة (من 1 إلى أقل من 5 درجة 2، ومن 5 إلى أقل من 15 درجة 3)، ما درجة القيمة؟","options":[{"key":"أ","text":"3، لأن القيمة المكتوبة في الحالة 5.4 مليون"},{"key":"ب","text":"2، لأن القيمة الصافية 4.86 مليون"},{"key":"ج","text":"3، لأن الطاقة تُكتب ولا تُطرح"},{"key":"د","text":"1، لأن الطاقة تلغي القيمة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"تكلفة الطاقة 3,000 × 180 = 0.54 مليون، فالصافية 4.86 مليون، وهي أقل من 5: درجة 2.","misconceptions":["يحسب الدرجة قبل طرح طاقة الذكاء الاصطناعي","","يكتب الميغاواط
